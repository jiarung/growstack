; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- ESP32-S3-WROOM-1 N16R8: 16MB quad flash + 8MB octal PSRAM ---
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = dio_opi   ; DIO flash + octal PSRAM
; This unit's off-brand flash (mfr 0x46) won't do DIO/QIO fast reads with the
; ROM's default dummy cycles -> "Invalid image block, can't boot". DOUT works.
; flash_mode=dout sets the header mode byte; build.boot=dio selects the prebuilt
; bootloader_dio_80m.elf (no dout variant ships), then its header is patched to dout.
board_build.flash_mode = dout
board_build.boot = dio
board_build.f_flash = 80000000L

; the s3cam/ subtree is a DIFFERENT board's firmware (thermal-imaging head);
; keep it out of the station build and vice versa
build_src_filter = +<*> -<s3cam/>

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    claws/BH1750@^1.3.0
    adafruit/Adafruit BME680 Library@^2.0.5
    adafruit/Adafruit SHT4x Library@^1.0.4
    adafruit/Adafruit AS7341@^1.4.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    sparkfun/SparkFun AS726X@^2.0.1
    bogde/HX711@^0.7.5
    adafruit/Adafruit PN532@^1.3.0
    adafruit/Adafruit SSD1306@^2.5.0
    adafruit/Adafruit GFX Library@^1.11.0

monitor_speed = 115200

; --- OTA (flash over WiFi) ---
; Prereq: the board already runs an OTA-capable build (USB-flash once first).
; ⚠️ ALWAYS pass --upload-port <device-ip>. Without it PlatformIO auto-detects the USB
;    serial port and espota tries to "invite" /dev/cu.* → "Host Not Found". mDNS is
;    unreliable on this AP, so use the IP (printed in the boot log: "[wifi] connected, IP ...").
; ⚠️ Run this env ALONE (-e ota). `pio run -t upload` with no -e also USB-flashes the other env.
;   export OTA_PASS='<the OTA_PASSWORD from secrets.h>'
;   pio run -e ota -t upload --upload-port 192.168.50.XX
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_flags = --auth=${sysenv.OTA_PASS}

; --- s3cam: Goouuu ESP32-S3-CAM (N16R8) + OV5640 — the thermal-imaging head's
; RGB side (tasks/mlx90640/phase-1b.md). A STANDARD N16R8: qio_opi, no dout —
; the station env's dout is a patch for THAT unit's off-brand flash, not a
; convention. Serial goes to UART0 (the TTL-marked USB-C); flash via that port.
;   pio run -e s3cam -t upload && pio device monitor
[env:s3cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_src_filter = -<*> +<s3cam/>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    adafruit/Adafruit_VL53L0X@^1.2.5
monitor_speed = 115200
