# Telegraf — bridges MQTT (Mosquitto) into InfluxDB. No code, just config.

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

# --- Input: subscribe to the broker ---
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["monitor-air/+/telemetry"]
  qos = 0
  data_format = "json"
  # measurement name for everything coming in on these topics
  name_override = "air"
  # all telemetry numbers are floats by contract (avoids int/float field conflicts)
  json_string_fields = []

  # turn the topic's 2nd segment into a `device` tag:
  #   monitor-air/<device>/telemetry  ->  device=<device>
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "monitor-air/+/telemetry"
    tags = "_/device/_"

# --- Input: plant-light on/off state (so Grafana can show when it ran) ---
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["monitor-air/+/light/state"]
  qos = 1
  data_format = "json"
  name_override = "light"
  # only the numeric `on` (1/0); state/source are strings, dropped by default

  # here the 2nd segment is a location, not a device:
  #   monitor-air/<location>/light/state  ->  location=<location>
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "monitor-air/+/light/state"
    tags = "_/location/_/_"

# --- Input: AS7341 ambient spectrum (8 visible channels + clear/nir + health) ---
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["monitor-air/+/spectrum"]
  qos = 0
  data_format = "json"
  name_override = "spectrum"
  # `mode` (ambient/reflect) and `plant` (reflect payloads, e.g. cactus-02) are
  # strings → promote them to tags; the rest (f415..f680, clear, nir,
  # saturated, ambient_leak, spectrum_read_ms) are numeric fields.
  # (request_id/status strings are intentionally dropped — per-request noise.)
  tag_keys = ["mode", "plant"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "monitor-air/+/spectrum"
    tags = "_/device/_"

# --- Input: local outdoor weather (Open-Meteo, no API key) ---
# Config-only poller — gives the plant data outdoor rain/cloud/solar context to
# correlate against indoor DLI. Location from .env (WEATHER_LAT/LON via container env).
[[inputs.http]]
  urls = ["https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&current=precipitation,rain,temperature_2m,relative_humidity_2m,cloud_cover,shortwave_radiation&timezone=Asia%2FTaipei"]
  # Poll far more often than the data changes — this is a RETRY budget, not a
  # sampling rate. Open-Meteo returns intermittent 503s (measured: 16-21 of 24
  # hourly polls failed over 2026-07-30..08-03) and inputs.http does NOT retry
  # inside an interval, so `1h` here turned every 503 into a whole missing hour
  # and left the panel mostly empty.
  # Polling faster is free of duplicates because the point's timestamp comes from
  # the payload's `current.time` (see timestamp_key below), which only advances
  # every 900 s: extra polls inside one slot rewrite the SAME point (same
  # measurement, same constant tags, same timestamp). So this buys ~3 attempts per
  # data slot at zero storage cost. 288 req/day is well inside the free tier.
  # Do NOT "optimise" this back to 1h — that reasoning is what broke it.
  interval = "5m"
  method  = "GET"
  timeout = "15s"
  data_format = "json_v2"
  name_override = "weather"
  # ponytail: inputs.http always adds a `url` tag; taginclude/tagexclude don't drop it
  # in 1.30 — left as-is. Harmless: one constant value (1 series) and the URL holds no key.
  [inputs.http.tags]
    source   = "open-meteo"
    location = "banqiao"
  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.object]]
      path = "current"
      timestamp_key      = "time"
      timestamp_format   = "2006-01-02T15:04"
      timestamp_timezone = "Asia/Taipei"
      excluded_keys = ["interval"]   # Open-Meteo's own "interval" number, not a metric

# --- Input: NFC weigh-station plant weight (enriched by Node-RED) ---
# Node-RED resolves the tag UID -> plant_id and republishes here. Telegraf
# subscribes ONLY to plant_weight, never measure/event_raw -> no double-write
# (the ESP is at-least-once; dedup happens in Node-RED).
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]   # REQUIRED — same broker as the other consumers
  topics = ["monitor-air/+/plant_weight"]
  qos = 0
  data_format = "json"
  name_override = "plant_weight"
  # `quality` is a soft-delete marker, not a filter: nothing is ever dropped, so a
  # bad reading stays queryable and a wrong call stays reversible. Node-RED sets
  # ok|empty; mark-weight.sh sets anything else (e.g. suspect) after the fact.
  tag_keys = ["plant_id", "quality"]   # (+ "measure_type" in Phase 4)
  json_string_fields = ["uid"]         # KEEP uid as a field so an "unknown" plant_id is still traceable

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "monitor-air/+/plant_weight"
    tags = "_/device/_"

# --- Output: write to InfluxDB 2.x ---
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "monitor-air"
  bucket = "sensors"
